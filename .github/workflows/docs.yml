name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Check translated page parity
        run: |
          diff \
            <(find docs/en -maxdepth 1 -name '*.md' -printf '%f\n' | sort) \
            <(find docs/es -maxdepth 1 -name '*.md' -printf '%f\n' | sort)
      - name: Build both languages in strict mode
        run: mkdocs build --strict
      # Pages serves the site under /WaterPipesModPZ/; mirror that so root-relative links resolve.
      - name: Stage site under its Pages path
        run: mkdir -p linkcheck && cp -r site linkcheck/WaterPipesModPZ
      - name: Check generated internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir '${{ github.workspace }}/linkcheck' 'linkcheck/WaterPipesModPZ/**/*.html'
          fail: true
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
